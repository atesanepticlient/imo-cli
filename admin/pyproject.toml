[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imo-admin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
]

[project.scripts]
imo-admin = "imo_admin.cli:run"

[tool.setuptools.packages.find]
include = ["imo_admin*"]

[tool.setuptools.package-data]
imo_admin = ["static/*"]