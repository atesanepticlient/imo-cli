[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imo-cli"
version = "0.1.0"
description = "Fast, concurrent IMO automation CLI on uiautomator2 — drop-in replacement for the Next.js/Appium USB-IMO-DOCK dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uiautomator2>=0.19",
    "rich>=13",
    "typer>=0.12",
    "Pillow>=10",
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.scripts]
imo = "imocli.cli:main"

[tool.setuptools.packages.find]
include = ["imocli*"]

